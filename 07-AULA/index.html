<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(●'◡'●)</title>
</head>
<body>
    

    <header>
        <H1>TRABALHANDO COM INPUTS</H1>
    </header>
    
    <main>
    <!-- INPUT -->

        <h2>Formulário de cadastro</h2>

            <!-- input - coleta informações do usuário -->
             <!-- form - engloba os campos do formulário -->
              <!-- method- como a informação vai -->
               <!-- action- para onde vai as informações -->
        <form action="" method="">

            <!-- Texto de apoio para o input -->
             <!-- label sem input -->
             <label for="nome_completo">Nome Completo:</label>
             <!-- textos -->
              <!-- name - usado para identificar o input quando enviar os dados-->
               <!--input - identificação do elemento do html  -->
             <input type="text" name="nome_completo" id="nome_completo">
<br> <br>
            <!-- input dentro do label -->

            <label >
                Senha
                <!-- senhas -->
                <input type="password" name="" id="" >
            </label>
        </form>
</main>

<footer> 
    <p>Meus direitos</p>
</footer>
</body>
</html>
