<!doctype html>
<html lang="pt-BR">
  <head>

  <body>
    <header>
      <h1>TABELA TOP</h1>

      <main>
        <h2>PRODUTOS</h2>

        <!-- CRIAÇÃO DA TABELA -->
        <table border="6x">
          <!-- CABEÇALO DA TABELA -->
          <thead>
            <!-- CRIAÇÃO DA LINHA -->
            <tr>
              <!-- COLUNA DE UM CABEÇALHO -->
              <th>ID</th>
              <th>NOME</th>
              <th>QUANTIDADE</th>
              <th>PREÇO</th>
              <th>CATEGORIA</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <!-- CELULA DA LINHA -->
              <td>1</td>
              <td>Shampo</td>
              <td>7</td>
              <td>R$ 77</td>
              <td>Beleza</td>
            </tr>
            <tr>
              <!-- CELULA DA LINHA -->
              <td>2</td>
              <td>Lixeira</td>
              <td>14</td>
              <td>R$ 10</td>
              <td>Domestico</td>
            </tr>
            <tr>
              <!-- CELULA DA LINHA -->
              <td>3</td>
              <td>Ovo</td>
              <td>12</td>
              <td>R$ 12</td>
              <td>Comida</td>
            </tr>
            <tr>
              <td>4</td>
              <!-- QUANTAS COLUNAS ELE PRENCHE -->
              <td colspan="2">Mucilon 500g</td>
              <!-- Prenche celulas de baixo -->
              <td rowspan="2">R$ 30</td>
              <td>Comida</td>
            </tr>
            <tr>
              <td>5</td>
              <td>Lavador anal</td>
              <td>3</td>
              <td>Criança</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="5">Tabela feita por: Lucas</td>
            </tr>
          </tfoot>
        </table>
      </main>
    </header>
  </body>
</html>
